name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Ndao-Hiady-Afo-Kasoka.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ndao-Hiady-Android-APK
          path: build/Ndao-Hiady-Afo-Kasoka.apk
          if-no-files-found: error
          retention-days: 14
